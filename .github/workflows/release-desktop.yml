name: Release CollectBot Desktop

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta*'

# Enforce least-privilege permissions
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Determine Release Channel
        id: channel
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -match "-beta") {
            Write-Host "Detected Beta Prerelease: $tag"
            "is_prerelease=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "channel=beta" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Detected Stable Release: $tag"
            "is_prerelease=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "channel=stable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Run Core Test Suite
        run: npm test

      - name: Run TypeScript Diagnostics
        run: npx tsc --noEmit

      - name: Compile Desktop Preload & Main
        run: npm run desktop:compile

      - name: Next.js Production Build Regression Check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://faoetyzqzqqtwatflefk.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy_anon_key_for_build' }}
        run: npm run build

      - name: Package Windows x64 NSIS Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Environment-based code signing (optional secrets, builds unsigned if omitted)
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run desktop:dist

      - name: Verify Installer Artifact Existence & Integrity
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "CollectBotSetup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "CRITICAL: CollectBotSetup installer was not generated in dist directory."
            exit 1
          }
          $sizeMb = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "Found installer: $($installer.Name) ($sizeMb MB)"
          if ($installer.Length -lt 10MB) {
            Write-Error "CRITICAL: Installer file size ($sizeMb MB) is unexpectedly below 10MB minimum threshold."
            exit 1
          }

      - name: Verify Update Metadata & Blockmap Existence
        shell: pwsh
        run: |
          $isBeta = "${{ steps.channel.outputs.is_prerelease }}" -eq "true"
          if ($isBeta -and (Test-Path "dist/latest.yml") -and (-not (Test-Path "dist/beta.yml"))) {
            Copy-Item "dist/latest.yml" "dist/beta.yml" -Force
          }
          $metaFile = if ($isBeta) { "dist/beta.yml" } else { "dist/latest.yml" }

          if (-not (Test-Path $metaFile)) {
            Write-Error "CRITICAL: Required update metadata file ($metaFile) was not generated by electron-builder."
            exit 1
          }

          $content = Get-Content $metaFile -Raw
          Write-Host "Update metadata ($metaFile):"
          Write-Host $content

          if ($content -notmatch "version:" -or $content -notmatch "files:") {
            Write-Error "CRITICAL: Update metadata ($metaFile) is missing required properties."
            exit 1
          }

          $blockmap = Get-ChildItem -Path dist -Filter "*.blockmap" | Select-Object -First 1
          if (-not $blockmap) {
            Write-Error "CRITICAL: Differential update blockmap (*.blockmap) was not generated."
            exit 1
          }
          Write-Host "Verified blockmap file: $($blockmap.Name) ($($blockmap.Length) bytes)"

      - name: Generate Cryptographic SHA-256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Filter "CollectBotSetup-*-x64.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $checksumContent = "$hash  $($_.Name)"
            $checksumFile = "$($_.FullName).sha256"
            $checksumContent | Out-File -FilePath $checksumFile -Encoding utf8
            $checksumContent | Out-File -FilePath dist/SHA256SUMS.txt -Append -Encoding utf8
            Write-Host "Generated SHA256 for $($_.Name): $hash"
          }

      - name: Generate Release Notes & Changelog
        shell: pwsh
        id: release_notes
        run: |
          $tag = $env:GITHUB_REF_NAME
          $channelName = "${{ steps.channel.outputs.channel }}"
          $isPrerelease = "${{ steps.channel.outputs.is_prerelease }}" -eq "true"

          $badge = if ($isPrerelease) { "⚠️ **BETA PRERELEASE**" } else { "✅ **STABLE PRODUCTION RELEASE**" }

          $notes = @"
          ## CollectBot Desktop $tag — $badge

          ### Release Channel: $($channelName.ToUpper())
          - **OS:** Windows 10 & Windows 11 (64-bit)
          - **Architecture:** x64
          - **Format:** Standard NSIS Windows Installer + Auto-Update Feed

          ### Highlights
          - Native Windows Desktop Integration for CollectBot Business OS.
          - Secure Google OAuth authentication via default system browser.
          - Single-instance process synchronization with `collectbot://` deep-linking.
          - Multi-workplace tenant isolation in dedicated persistent partition.
          - Native PDF invoice downloads and CSV export handling.
          - Differential background auto-updating with blockmap integrity verification.
          - Hardened IPC boundaries with zero Node.js runtime exposure to renderer JavaScript.

          ### Verification & Security
          Download the installer and verify its cryptographic integrity using the matching SHA-256 checksum file:
          ```powershell
          Get-FileHash -Algorithm SHA256 CollectBotSetup-*-x64.exe
          ```
          "@
          Set-Content -Path dist/RELEASE_NOTES.md -Value $notes -Encoding utf8

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CollectBot Desktop ${{ github.ref_name }}"
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.channel.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/CollectBotSetup-*-x64.exe
            dist/CollectBotSetup-*-x64.exe.blockmap
            dist/CollectBotSetup-*-x64.exe.sha256
            dist/*.yml
            dist/SHA256SUMS.txt
